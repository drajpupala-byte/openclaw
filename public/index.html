<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw — TradingView + Claude</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 20px; font-weight: 600; }
    header .badge {
      font-size: 11px;
      background: #388bfd26;
      color: #58a6ff;
      border: 1px solid #388bfd66;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .symbol-bar {
      padding: 12px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .symbol-bar input {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 120px;
    }

    .symbol-bar button {
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .symbol-bar button:hover { background: #2ea043; }

    .symbol-bar .analyze-btn {
      background: #388bfd26;
      border-color: #388bfd66;
      color: #58a6ff;
      margin-left: auto;
    }

    .symbol-bar .analyze-btn:hover { background: #388bfd40; }
    .symbol-bar .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chart-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chart {
      flex: 1;
    }

    #volume-chart {
      height: 100px;
      border-top: 1px solid #21262d;
    }

    .sidebar {
      width: 340px;
      border-left: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header .claude-dot {
      width: 8px;
      height: 8px;
      background: #58a6ff;
      border-radius: 50%;
    }

    .sidebar-header .claude-dot.streaming {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #analysis {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #c9d1d9;
      white-space: pre-wrap;
    }

    #analysis .placeholder {
      color: #484f58;
      font-style: italic;
    }

    .price-info {
      padding: 10px 24px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #8b949e;
    }

    .price-info span strong { color: #e6edf3; }
  </style>
</head>
<body>

<header>
  <h1>OpenClaw</h1>
  <span class="badge">TradingView + Claude</span>
</header>

<div class="symbol-bar">
  <input id="symbol-input" type="text" value="DEMO" placeholder="Symbol" />
  <button id="load-btn">Load Chart</button>
  <button id="analyze-btn" class="analyze-btn" disabled>Ask Claude ✦</button>
</div>

<div class="main">
  <div class="chart-pane">
    <div id="chart"></div>
    <div id="volume-chart"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="claude-dot" id="claude-dot"></div>
      Claude Analysis
    </div>
    <div id="analysis">
      <span class="placeholder">Load chart data then click "Ask Claude ✦" to get AI analysis of the price action.</span>
    </div>
  </div>
</div>

<div class="price-info" id="price-info">
  <span>Open: <strong id="pi-open">—</strong></span>
  <span>High: <strong id="pi-high">—</strong></span>
  <span>Low: <strong id="pi-low">—</strong></span>
  <span>Close: <strong id="pi-close">—</strong></span>
  <span>Volume: <strong id="pi-vol">—</strong></span>
</div>

<script>
  let chartData = [];
  let candleSeries = null;
  let volumeSeries = null;

  // ── Initialise TradingView Lightweight Charts ──────────────────────────────

  const mainChart = LightweightCharts.createChart(
    document.getElementById("chart"),
    {
      layout: { background: { color: "#0d1117" }, textColor: "#8b949e" },
      grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: "#30363d" },
      timeScale: { borderColor: "#30363d", timeVisible: true },
      handleScroll: true,
      handleScale: true,
    }
  );

  const volChart = LightweightCharts.createChart(
    document.getElementById("volume-chart"),
    {
      layout: { background: { color: "#0d1117" }, textColor: "#8b949e" },
      grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
      rightPriceScale: { borderColor: "#30363d", scaleMargins: { top: 0.1, bottom: 0 } },
      timeScale: { borderColor: "#30363d", timeVisible: true, visible: false },
      handleScroll: false,
      handleScale: false,
    }
  );

  candleSeries = mainChart.addCandlestickSeries({
    upColor: "#238636",
    downColor: "#da3633",
    borderUpColor: "#2ea043",
    borderDownColor: "#f85149",
    wickUpColor: "#2ea043",
    wickDownColor: "#f85149",
  });

  volumeSeries = volChart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "",
  });

  // Sync time scales
  mainChart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (range) volChart.timeScale().setVisibleLogicalRange(range);
  });

  // Crosshair price info
  mainChart.subscribeCrosshairMove((param) => {
    if (!param.time || !candleSeries) return;
    const d = param.seriesData.get(candleSeries);
    if (!d) return;
    document.getElementById("pi-open").textContent = "$" + d.open;
    document.getElementById("pi-high").textContent = "$" + d.high;
    document.getElementById("pi-low").textContent = "$" + d.low;
    document.getElementById("pi-close").textContent = "$" + d.close;
    const vol = chartData.find((c) => c.time === param.time)?.volume;
    document.getElementById("pi-vol").textContent = vol ? vol.toLocaleString() : "—";
  });

  // Resize
  const resizeObserver = new ResizeObserver(() => {
    mainChart.applyOptions({ width: document.getElementById("chart").clientWidth });
    volChart.applyOptions({ width: document.getElementById("volume-chart").clientWidth });
  });
  resizeObserver.observe(document.getElementById("chart"));

  // ── Load chart data ────────────────────────────────────────────────────────

  async function loadData() {
    const res = await fetch("/api/chart-data");
    chartData = await res.json();

    candleSeries.setData(chartData.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));

    volumeSeries.setData(chartData.map(({ time, close, open, volume }) => ({
      time,
      value: volume,
      color: close >= open ? "#23863640" : "#da363340",
    })));

    mainChart.timeScale().fitContent();
    document.getElementById("analyze-btn").disabled = false;

    const last = chartData[chartData.length - 1];
    document.getElementById("pi-close").textContent = "$" + last.close;
  }

  document.getElementById("load-btn").addEventListener("click", loadData);
  loadData();

  // ── Claude analysis via SSE ────────────────────────────────────────────────

  document.getElementById("analyze-btn").addEventListener("click", async () => {
    if (!chartData.length) return;

    const analyzeBtn = document.getElementById("analyze-btn");
    const analysisDiv = document.getElementById("analysis");
    const dot = document.getElementById("claude-dot");

    analyzeBtn.disabled = true;
    dot.classList.add("streaming");
    analysisDiv.textContent = "";

    const symbol = document.getElementById("symbol-input").value || "DEMO";

    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: chartData, symbol }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") break;
          try {
            const { text } = JSON.parse(payload);
            analysisDiv.textContent += text;
            analysisDiv.scrollTop = analysisDiv.scrollHeight;
          } catch (_) {}
        }
      }
    } catch (err) {
      analysisDiv.textContent = "Error: " + err.message + "\n\nMake sure ANTHROPIC_API_KEY is set on the server.";
    } finally {
      analyzeBtn.disabled = false;
      dot.classList.remove("streaming");
    }
  });
</script>

</body>
</html>
